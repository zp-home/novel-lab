<html lang="zh-CN">

<title>四界 · 正文生成进度</title>
<style>
:root{
  --bg:#080b12;--panel:#111827;--panel2:#151d2e;--line:#1e293b;
  --txt:#cbd5e1;--txt2:#94a3b8;--dim:#64748b;
  --cyan:#22d3ee;--emerald:#34d399;--amber:#fbbf24;--rose:#fb7185;
  --violet:#a78bfa;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);
  font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  font-size:13px;line-height:1.6}
.wrap{max-width:1560px;margin:0 auto;padding:20px 24px 60px}

header{display:flex;align-items:flex-end;justify-content:space-between;
  gap:20px;padding-bottom:16px;margin-bottom:18px;
  border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font-size:20px;font-weight:600;color:#e2e8f0;letter-spacing:.5px}
h1 span{color:var(--cyan)}
.sub{color:var(--dim);font-size:12px;margin-top:3px}
.kpis{display:flex;gap:26px;flex-wrap:wrap}
.kpi{text-align:right}
.kpi .v{font-size:22px;font-weight:600;color:var(--cyan);
  font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .l{font-size:10.5px;color:var(--dim);letter-spacing:.4px}

.panel{background:linear-gradient(180deg,var(--panel),var(--panel2));
  border:1px solid var(--line);border-radius:10px;padding:16px 18px;
  margin-bottom:14px;position:relative}
.panel::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,#2a3a52,transparent)}
.panel h2{font-size:13px;font-weight:600;color:#e2e8f0;margin-bottom:4px;
  display:flex;align-items:center;gap:8px}
.panel h2 .tag{font-size:9.5px;padding:1px 6px;border-radius:3px;
  background:rgba(34,211,238,.12);color:var(--cyan);letter-spacing:.3px}
.note{font-size:11px;color:var(--dim);margin-bottom:12px}

/* 进度条 */
.prog{height:26px;background:rgba(30,41,59,.6);border-radius:6px;
  overflow:hidden;position:relative;margin:10px 0 6px}
.prog .fill{height:100%;background:linear-gradient(90deg,#0891b2,#22d3ee);
  transition:width .6s ease;position:relative}
.prog .fill::after{content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);
  animation:shim 2.2s infinite}
@keyframes shim{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.prog .lbl{position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;font-size:11.5px;font-weight:600;
  color:#e2e8f0;text-shadow:0 1px 3px rgba(0,0,0,.7);
  font-variant-numeric:tabular-nums}

/* 幕进度 */
.actbars{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.actbar{flex:1;min-width:120px}
.actbar .nm{font-size:10px;color:var(--dim);margin-bottom:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actbar .tr{height:6px;background:rgba(30,41,59,.8);border-radius:3px;
  overflow:hidden}
.actbar .tr div{height:100%;background:var(--cyan);transition:width .5s}
.actbar .ct{font-size:9.5px;color:var(--txt2);margin-top:2px;
  font-variant-numeric:tabular-nums}

/* 章节网格 */
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));
  gap:5px;margin-top:8px}
.ch{aspect-ratio:1;border-radius:4px;display:flex;align-items:center;
  justify-content:center;font-size:10px;font-variant-numeric:tabular-nums;
  cursor:pointer;transition:.15s;border:1px solid transparent;
  color:#0b1220;font-weight:600}
.ch.done{background:linear-gradient(135deg,#0d9488,#22d3ee)}
.ch.warn{background:linear-gradient(135deg,#b45309,#fbbf24)}
.ch.bad{background:linear-gradient(135deg,#9f1239,#fb7185)}
.ch.todo{background:rgba(30,41,59,.6);color:var(--dim);font-weight:400}
.ch:hover{transform:scale(1.15);border-color:#fff;z-index:2}

/* 预览 */
.preview{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
@media(max-width:1000px){.preview{grid-template-columns:1fr}}
.prevbox{background:#060910;border:1px solid var(--line);border-radius:8px;
  padding:12px 14px;font-size:12px;line-height:1.85;color:#a8bdd9;
  max-height:340px;overflow:auto;white-space:pre-wrap}
.prevbox .hd{font-size:10.5px;color:var(--dim);margin-bottom:8px;
  padding-bottom:6px;border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;gap:10px}
.prevbox .hd b{color:var(--cyan);font-weight:500}

/* 表格 */
table{width:100%;border-collapse:collapse;font-size:11px}
th{text-align:left;padding:6px 9px;color:var(--dim);font-weight:500;
  border-bottom:1px solid var(--line);font-size:10px;
  text-transform:uppercase;letter-spacing:.4px;position:sticky;top:0;
  background:var(--panel)}
td{padding:5px 9px;border-bottom:1px solid rgba(30,41,59,.5);
  color:var(--txt2);font-variant-numeric:tabular-nums}
tr:hover td{background:rgba(34,211,238,.05)}
td.mono{font-family:ui-monospace,monospace;font-size:10.5px}
.tblwrap{max-height:420px;overflow:auto}

.pill{display:inline-block;padding:1px 6px;border-radius:3px;font-size:9.5px}
.pill.ok{background:rgba(52,211,153,.15);color:var(--emerald)}
.pill.warn{background:rgba(251,191,36,.15);color:var(--amber)}
.pill.bad{background:rgba(251,113,133,.18);color:var(--rose)}

::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2a3a52;border-radius:4px}
</style>
</head>

<script>
let DATA = {"generated": 18, "target": 200, "total_chars": 58967, "avg": 3276, "updated": "2026-11-26 13:44:53", "chapters": [{"no": 1, "chars": 3289, "english": 0, "banned": 0, "title": "碑印辞二", "level": "炼气初期", "act": "第一幕 · 铁匠之子", "volume": "第1卷 · 人界·痕镜", "head": "渡口的石阶被水汽浸得发黑，林昭踩上去时鞋底滑了半寸。他稳住身子。前面排了二十来号人，都缩着脖子等渡船靠岸。沈鹤年站在队伍最前头，右手攥着一卷纸。缺了半截小指的地方正好卡住纸卷的边沿。那卷纸露出来的部分焦黑卷曲，边沿卷得厉害，林昭一眼认出是账本。“哥，那是不是咱家那本？”林小满从后头凑上来，嗓门没压住。她右手小指少了一节，指账本时那截缺口晃了晃。林昭没答。他往沈鹤年那边挪了半步，想看清账本边缘的焦痕。队伍前面那个穿灰袍的渡口管事，一张一张翻着过客的路引，翻完就丢进脚边的竹筐。轮到沈鹤年了。“沈老爷子，路引。”管事伸出", "tail": "三不验墨，验手印。那笔谁经手？”她顿了顿：“赵麻子。”他哼一声：“让赵麻子补个手印，就说当日漏按。他不肯，你提他私扣的八斤盐，他比谁按得都快。”她把账本揣好：“刘三那边谁去说？”他装上烟：“我去。只说账本被孩子扯了，补页是赵麻子经手。”她问：“赵麻子要是不认？”他：“不敢。”顿一下，“刘三要查，查手印，查不到我头上。”"}, {"no": 2, "chars": 3357, "english": 0, "banned": 0, "title": "影坝传下", "level": "炼气初期", "act": "第一幕 · 铁匠之子", "volume": "第1卷 · 人界·痕镜", "head": "火折子的光只照见账本一角。林昭蹲在渡口最下一级石阶上，把烧了一半的册子按在膝头。河风从下游灌上来，火苗歪向水面，他用手掌挡回去。“烧啊。”岸上有人催，声音压得低。没应声。他左手虎口的茧蹭过封皮，那里原本有字，如今只剩一层黑壳。账本是从镇东米行的夹墙里翻出来的，牵涉三家地契，谁沾手谁倒霉。今夜来渡口，就是要让它变成灰。烧不干净，比不烧更麻烦。这话沈鹤年说过，林昭记了三年。可火折子凑到纸角，烧到一半，他自己把火掐了。岸上站了七八个人，都是林小满挨家敲门叫起来的。她打的主意简单：让全镇都看见账本没了。往后谁再拿这事做文章", "tail": "下面垫着三块石，抽中间那块，绳头能松，不用动桩。”林昭看她：“你记得？”小满说：“我爹绑的，我搭过手。”赵七问：“抽了石，桩歪了谁扶？”小满说：“你扶。我抽。林昭看水，水到第二道刻痕就喊。”林昭把灯芯拧回一圈：“现在就走。赵七，你先把桥板下那根备绳拖出来，别等水漫上来才找。”赵七应了一声，竹竿换到肩头，三个人往西坡去。"}, {"no": 3, "chars": 3279, "english": 0, "banned": 0, "title": "归痂誓断", "level": "炼气初期", "act": "第一幕 · 铁匠之子", "volume": "第1卷 · 人界·痕镜", "head": "渡口的石阶被水汽浸得发黑。林昭坐在最下面一级，膝盖上搁着一本册子，边角焦黑卷起。林小满蹲在他身后三步远，拿石子往水里扔。“船到底来不来？都等半个时辰了。”林昭没有接话。左手压在册子上，拇指抵住烧焦的那一边，册子始终没有摊开。“小满。”沈鹤年坐在石阶中段，掰了半块干饼往嘴里送。他那只灰白的左眼对着河面，右眼半眯着。“你哥在算账，你替他算？”林小满撇了撇嘴，没再说话。这册子是三天前从当铺流出来的，账面记着林家铁匠铺欠下的一笔料钱。数目不大，但牵着一份地契的抵押。放贷的牙人昨天捎了口信，说账本在渡口交接，人不到，地契就归", "tail": "？”“封住了，谁也改不了。”铁盒盖上，“改不了，债就跑不了。”“哥，你是不是傻？债跑不了，你拿什么还？”铁盒放回床底。“慢慢还。”“慢慢还？你当人家会等你慢慢还？”“不等就找。”“找什么？”“找学徒。”林小满张着嘴。“你刚才说债是你的。”“债是我的，学徒也是我的。”“你找学徒干什么？”“问清楚谁让他刮的账。”没人接话。"}, {"no": 4, "chars": 3040, "english": 0, "banned": 0, "title": "茧药笺残", "level": "炼气初期", "act": "第一幕 · 铁匠之子", "volume": "第1卷 · 人界·痕镜", "head": "渡口管事赵德贵蹲着抽烟，烟锅子灭了半炷香也不点。水涨到第三级。林昭站在水边两步远，目光搁在赵德贵后脑勺上。缆绳绷在木桩上，吱吱响。林小满把包袱皮解开又系上，系上又解开，第三次伸手的时候被林昭按住了。“哥，他到底看不看。咱都等了一个时辰了，渡船走了两班了。”青牛镇口音从牙缝里挤出来。沈鹤年从林昭手里接过那叠焦纸，蹲到赵德贵对面。石阶上的水渍没干，焦纸搁下去边角就沾了潮。赵德贵把烟杆从嘴里拔出来，在鞋底上磕了磕。磕出来的烟灰掉在石阶上，他拿鞋底蹭了蹭，蹭完又拿手拍了拍裤腿。“急什么。”沈鹤年说。他把焦纸一张一张摊在石阶", "tail": "，抽了一口。“周老六那边，你们什么时候动身？”林昭说：“明早。”沈鹤年吐了口烟。“急什么。”掏出一张地址纸，放在桌上。“汉口码头，姓刘的茶铺后头。”看了一眼。“周老六在茶铺后头开了个赌坊。你去了，先别进赌坊，找茶铺刘掌柜，问他周老六欠他多少茶钱。”林昭把地址纸收好。沈鹤年把布袋里的拓纸抽出来，对着灯看了一遍，又塞回去。"}, {"no": 5, "chars": 3306, "english": 0, "banned": 0, "title": "债锤契十", "level": "炼气初期", "act": "第一幕 · 铁匠之子", "volume": "第1卷 · 人界·痕镜", "head": "渡口挤了三拨人。林昭站在过道边上，账本拿在手里。从火场扒出来三天了，他一直没工夫细看。眼下要确认的事只有一件。账本边沿的折痕，是火烧之前就有的，还是之后被人翻出来的。石阶上人来人往，他拿身子挡住账本，低头看。焦痕在日头底下分两层，外头一层是新烧的，里头那层发黑发亮的是老茬。要是有人翻过，手指头捏的地方准会蹭掉老茬上的炭皮。林昭拇指按着边沿，顺着摸过去，摸到第三道折痕的时候停了手。“哥，你站那儿跟桩子似的。”林小满从人堆里挤过来，手里攥着半块烧饼，嘴角沾着芝麻，“船靠岸两趟了，你走不走？”“不走。”“不走你蹲这儿干什", "tail": "”林昭知道他在拿字换话，字一露，价就由他定。他伸手要账本，沈鹤年用刀背一挡：“你妹妹的手不能沾纸，一沾灰就吃进字里。”林昭缩回手，改问：“缺哪几个字？”沈鹤年刀尖往左一挪，焦皮又裂一道，露出“七”和半个“十”。小满踮脚：“七十七？”沈鹤年把刀一横，正好挡住后面：“到这儿，够了。”林昭明白，他不是刮不开，是不肯一次刮开。"}, {"no": 6, "chars": 3229, "english": 0, "banned": 0, "title": "痕锤檄前", "level": "炼气初期", "act": "第一幕 · 铁匠之子", "volume": "第1卷 · 人界·痕镜", "head": "渡口等船的人挤了半条石阶。沈鹤年坐在最上头那根拴船桩上，从袖子里掏出烧焦的账本，搁在膝头摊开。账本没卷。焦黑的边沿朝着外头，离他最近的两个挑夫同时别过脸去。林昭站在桩子侧面。风把纸灰吹到他手背上，他没动。账本左边那截焦边翘着，比右边短了一指。断口参差，但翘起来的那片焦纸底下压着另一层没烧透的纸页。两层之间有一道细缝，缝里干净，没有灰。烧的时候火从上头走，底下这层要是没被人翻过，灰该落满。林昭把手抬起来，又放下。师父还在说话。「沈老爷子，」卖盐的赔着笑，眼睛盯着自己脚尖，「这账本烧了就烧了，您老拿出来，大伙心里不踏实", "tail": "烧到的布面。布面上有一道旧折痕，折痕里卡着半截针。“你说呢？”沈鹤年把揭下来的焦片递给林昭，没看任何人。林昭接过去，翻了个面。焦片背面有半截针脚，跟卖盐的婆娘缝补的手艺对不上，跟方才卖盐的袖口补丁更对不上。他把焦片捏在指间，没扔。雪落在账本焦黑的边上。沈鹤年用拇指把雪末子抹掉，炭灰和雪水混成一道黑印子，留在焦边最外头。"}, {"no": 7, "chars": 3153, "english": 0, "banned": 0, "title": "隙药笺前", "level": "炼气初期", "act": "第一幕 · 铁匠之子", "volume": "第1卷 · 人界·痕镜", "head": "渡口的早市散了，石阶上剩一层湿脚印。林小满蹲在系船的石桩前，从袖里抽出那半本账本，摊在桩面上。焦黑的纸边翘着，风一吹就翻。她用手掌压住，抬头看了一圈。船老大在船尾解缆绳，两个脚夫蹲在跳板旁啃干饼，谁也没往这边看。这趟来，她袖里还揣着两块下品灵石，是兄妹俩在铁匠铺抡了半个月锤攒下的。债要还，可还多少得账本说了算。来还债的人先得把账认明白，可这本账烧过，边上的口子又不齐整，她心里没底。林小满指着其中一行：“腊月十六，三石灵谷，谁经的手？”没人说话。缆绳从船老大手里滑下去，啪地打在水面。她等了一会儿，又把账本往石桩中间推", "tail": "“所以只数到二十。你报数，我揭。”他数到七，焦边翘起一线；数到十二，那半行墨已经能看见第二笔。林昭停手，把灯芯捻低：“剩下的不揭了，先拓。”那人问：“拓哪半行？”她指着“押”字右下：“这里像还有一笔，先记位置，再蒸下一层。”他没动，先问：“要是下一层也带水呢？”林昭把针放下：“那就换法子——从书脊缝往里拆，不碰字面。”"}, {"no": 8, "chars": 3399, "english": 0, "banned": 0, "title": "渡印简断", "level": "炼气初期", "act": "第一幕 · 铁匠之子", "volume": "第1卷 · 人界·痕镜", "head": "渡口的雾散得慢，头一班船还没开。林昭把账本搁在缆桩上，底下垫了块油布，四角压着石子。船在跳板下晃，缆绳磨得吱呀响。这半本账是从仓房的火里抢出来的，封皮早没了，纸页一碰就掉渣。他要的答案只有一条：谁先动的手。灰堆里的脚印被踩乱过三回，问不出人。账本边缘还留着痕迹，翻页的人从哪头下手，撕口朝哪边卷，这些改不了。要是有人抢在前头做了手脚，也只能从这圈边上看出名堂。沈鹤年蹲在石阶上，右手在膝盖上敲了两下。“未必是烧的时候掉的。”他说。林昭没回头。“撕口在边上，火烧不到那么齐。”林小满站在跳板另一头，饼嚼了一半就停了。候船的", "tail": "”拿指甲顺着烧焦的边刮，新蜡一层层掉，底下露出旧纸的毛茬。毛茬里有一道细槽，从渡印断口斜着划出去。这道槽要是刀刮出来的，那封蜡的人就是在沈鹤年之前动过账本的人。赵五伸头看了一眼，又缩回去。林昭站在香案正面：“谁先动的手，就站到灯下来。”没人动。祠堂里没人被请出去。林小满把账本残边压在香案正中，拿竹片顺着焦口一下一下剔。"}, {"no": 9, "chars": 3101, "english": 0, "banned": 0, "title": "债函赋下", "level": "炼气初期", "act": "第一幕 · 铁匠之子", "volume": "第1卷 · 人界·痕镜", "head": "渡口只剩一条船。艄公蹲在船头抽烟，等潮水涨起来才肯走。林昭把那卷东西从怀里摸出来，在膝盖上摊开。焦黑的纸边一碰就掉渣。他拿拇指压了压，虎口上打铁磨出的厚茧蹭过纸缘。沈鹤年坐在旁边的石墩上，缺了小指的那只右手搭着膝盖，朝林昭那边偏了偏。“你说呢，这账本烧成这样，还能看出几条路来？”“该看的都还在。”林昭把纸边又压平了一道，压一下掉一片黑渣。“哥，债函上的日子快到了。”林小满从后面凑上来，下巴几乎搁在他肩膀上。她凑得近，倒不是真怕看漏字，是怕林昭手一重把最后那点能认的地方也蹭没了。“咱要是连账本都看不清，拿什么去跟人谈", "tail": "“是姓周的？”林小满凑过来。“未必。”沈鹤年把纸边挪开半寸，又按回去，“三笔对两笔，剩下一笔烧没了。”“痕迹还在。”他补了一句，声音很慢，“就是短了半截。”林昭看着那个名字。“烧掉的那半截，捞不回来。”沈鹤年合上旧账，“往后拿这个去问人，人家只认半截。”林小满不说话了。夹进旧账的纸边被合上，木匣推回供桌底下。灯还亮着。"}, {"no": 10, "chars": 3320, "english": 0, "banned": 0, "title": "茧薪书半", "level": "炼气初期", "act": "第一幕 · 铁匠之子", "volume": "第1卷 · 人界·痕镜", "head": "渡口石阶泡得发黑。林小满蹲在第三级上，掌心按住账本的焦边。纸页脆得掉渣，小指缺了一节，压不严实，只能用整个巴掌兜着。渡船刚走，下一班还得等半个时辰。码头上蹲着七八个等船的，挑担的、背篓的、赶猪的，挤在石阶两边的空地上。货栈的刘掌柜昨儿放话，说账本在谁手里谁认账。林小满今早就把账本按在了渡口石阶上，等着人来认。“哥，你过来瞧。”她偏头喊，青牛镇口音拖得长，“这账不对头。”林昭站在她身后半步，没动。日头偏西，等船的人蹲着站着，没一个往这边扭头。撑船的老周在船头刮锅底灰，铁片蹭木头的声响一下一下传过来，盖过了她的嗓门。“", "tail": "”\n“灶上刘跛子，给两个铜板就抬栅。可他嘴碎，见生人必问。”\n“你先进镇，拿你爹药方，纸上有周先生名号，给刘跛子看，只说抓药。”\n“你呢？”\n“我后脚走水沟，账本不经过税卡。碎屑包我带着，进周家前塞灶膛灰里，认完再取。”\n“他要是不认？”\n“你问他，戳角缺的那一点，是不是他补的。”\n林小满把草纸包往怀里塞深，点了点头。"}, {"no": 11, "chars": 3236, "english": 0, "banned": 0, "title": "井河志上", "level": "炼气初期", "act": "第一幕 · 铁匠之子", "volume": "第1卷 · 人界·痕镜", "head": "旧屋的门板斜挂在门框上，推一下就晃。林昭侧身进去，脚底踩到碎瓦，脆响在空屋里弹了两下。他站住，等眼睛适应暗。“找。”他只说了一个字。沈鹤年没急着迈步。缺了半截小指的右手搭在门框上，食指叩了两下木面，灰簌簌落下来。“东西在不在还两说。”他声音不高。林小满从林昭身后挤进来，鼻子先皱起来。“这屋多久没人住了？一股霉味。”“三个月。”林昭答得短。他在门框上摸了一把，锁鼻歪向一边，撬痕是新的，铁屑还没锈。“有人撬过锁。”“你怎么知道是三个月？”“锈层厚度。”林昭把手指上的铁锈蹭在裤腿上，“撬痕没锈，三天以内。”林小满撇了撇嘴", "tail": "大，纸就烂。”他摸出半截炭条，在碎石背面画了个叉，又把三块尖石挪了位，只留一道窄缝。“明早看，叉朝外是有人翻过；朝里，是风挪的。”林小满说：“那麻布呢？”林昭说：“先别动。你去前院盯井台，谁问崖边，就说我腿伤犯了。”林小满说：“你使唤我。”林昭说：“你脚快。”她起身，走两步回头：“手印要是你的呢？”林昭说：“更得钓。”"}, {"no": 12, "chars": 3306, "english": 0, "banned": 0, "title": "钉绳册重", "level": "炼气初期", "act": "第一幕 · 铁匠之子", "volume": "第1卷 · 人界·痕镜", "head": "旧屋是三天前找到的。在青牛镇西头，离铁匠铺隔了四条巷子。门板没了，拿砖头封了半截。砖头码得整齐，一看就是熟人干的。他把砖拆了，从灶膛灰堆里刨出这本册子，封面烧没了，边角焦黑卷曲。册子搁在桌上。「哥，你翻墙进去的？」林小满蹲在桌边，手指在册子边沿碰了一下，又缩回来。「真的假的，这玩意儿烧成这样还能看？」林昭靠在门框上，嗯了一声。「你别嗯啊。」林小满站起来，拍了拍手上的灰。「这屋子谁住的？跟咱爹什么关系？你总得说清楚。别又跟上次似的，问半天憋不出三个字。」「账本。」林昭说。「铁匠铺的账本。」林小满围着桌子转了半圈，嘴里", "tail": "不清，镜反光斜着打，槽里的墨点才不糊。”林小满点头，又皱眉：“账本搁祠堂，族里人知道了，先骂的是咱。”林昭说：“所以明日先不喊人。你只管盯灰，我认字。认出一笔，抄一笔，原册不动。”他顿了顿，“还有，今晚你别睡死，听见门轴响，先看灰，再喊我。”林小满应下，又问：“册子真不带走？”林昭说：“带走就打草惊蛇。”林小满没再问。"}, {"no": 13, "chars": 3298, "english": 0, "banned": 0, "title": "影刀辞六", "level": "炼气初期", "act": "第一幕 · 铁匠之子", "volume": "第1卷 · 人界·痕镜", "head": "旧屋的窗纸破了，风从缺口灌进来，火盆里的灰扑人脸。林昭站在门槛内没往里走，林小满在身后半步，捂着嘴。“师父。”林昭说。沈鹤年坐在火盆边的小凳上，背对着门。右手捏着半本册子，纸页焦黑卷曲。左手边搁着半碗凉水。“来了。”沈鹤年头也没回，“火盆里有炭，自己烤。”林昭没动。视线落在那本册子上，账本烧焦了，右下角缺了一块，断口整齐。火盆的光映着沈鹤年半边脸，左眼灰白，一动不动，像在看册子又像在看别处。“那角呢？”他问。沈鹤年翻了一页，焦纸细碎地响。动作很慢，一页一页地翻。“你说呢？”林小满在身后说：“哥，这屋里烟太大，我出去", "tail": "” “烧账得用火。祠堂夜里只准点一盏长明灯，谁添过油，灯芯剪没剪，门房都记。根叔若说没进过祠堂，油账先对不上。” 林小满脚步慢了：“那供桌上的碎屑呢？” “留着。他若来收，灰印就动；不动，说明他还不晓得我们看出来了。” 说话间到了院门口，林昭把门闩抬起一半，又放下：“从侧门走，正门有锁，锁簧响。” 林小满先侧身挤出去。"}, {"no": 14, "chars": 3283, "english": 0, "banned": 0, "title": "井函帖残", "level": "炼气初期", "act": "第一幕 · 铁匠之子", "volume": "第1卷 · 人界·痕镜", "head": "旧屋里，风从窗洞灌进来，吹得账本纸页翻动。账本摊在桌面上，翻到缺角那页，手指压住纸边。这本账是从铁匠铺后墙夹层里掏出来的，烧了半边，剩下的字也糊了大半。缺的那一角正好是银钱往来的数目，全没了。“哥，这地方邪性，真要看啊？”林小满站在门槛外头，没往里走，木棍杵在地上戳出一个小坑。\n“嗯。”他没抬头。\n“上次隔壁王婶说这屋晚上有动静。”\n“那是风把门板吹松了。”\n“风能把门板吹掉？”\n他把碎渣拢到桌角，一片一片拼。沈鹤年坐在门槛另一头。右手搭在膝盖上，缺了半截小指的指根压着裤缝。左眼对着院里那棵枯枣树。\n“先看看缺的是", "tail": "供。你少一样，纸就成灰。”小满笑了一下：“货单在袖里。”她没掏，先问，“你替谁拦我？”\n“账房。”\n“账房只认焦边，不认人。”\n她往门边挪，算着对方若抢麻袋，自己就先把纸吞了；若喊人，就咬死这张是从旧屋捡的。那人却递来火折子：“烧了，我放你走。”小满接过来，转手塞进他掌心：“要烧你烧，陈记的缺角，烧了可对不上第二本。”"}, {"no": 15, "chars": 3259, "english": 0, "banned": 0, "title": "灰印诰下", "level": "炼气初期", "act": "第一幕 · 铁匠之子", "volume": "第1卷 · 人界·痕镜", "head": "旧屋塌了半边，梁木斜插进灶台。林昭蹲在灰堆前，手伸进去扒了半尺，摸出一本册子。封皮烧没了，内页焦了大半，手指一捻就掉渣。他把册子摊在膝盖上，一页页翻。翻到第七页，停住。缺角。纸页右下撕掉一块，撕口整齐，不像火烧的。“哥，你翻那破本子干啥？”林小满站在门口，手里提着半桶水，桶底滴滴答答漏。她探头看了一眼，撇嘴，“烧成这样了，还能看出啥？”林昭没应。指腹在缺角边缘蹭了两下。撕口太齐了，齐得像拿尺子比着裁的。他翻到背面，对着破窗透进来的光看——纸茬子上有一层极细的灰印，是手指捏过的痕迹。“有人先来过。”他说。林小满把桶往", "tail": "巷口井边，蘸一点水，点在断口背面。正面不能见湿，见湿就起皱。”她点头，又摇头：“井边有人。”“所以你先走，把门带上，让雪落回去。若有人问，你说屋里漏风，来取旧纸引火。”她把纸页贴进袖内，走了两步又回头：“要是他翻袖呢？”林昭蹲下，把废纸灰倒进掌心：“那就让他先看见这个。”他握拳，灰从指缝里漏下一点，落在雪上，黑得很轻。"}, {"no": 16, "chars": 3305, "english": 0, "banned": 0, "title": "锈锤谱下", "level": "炼气初期", "act": "第一幕 · 铁匠之子", "volume": "第1卷 · 人界·痕镜", "head": "灰从门楣上落下来。林昭在门槛外站了一会儿，等它落定。地上一层灰，正中间有一道淡痕，从门槛通到铁砧脚下。他绕开那道痕走进去，伸手在铁砧上抹了一把。灰底下露出铁色，凉的。有人来过。走的时候扫了一遍地，想把脚印盖回去，扫得急，边角没盖匀。“哥。”身后脚步响。林小满跨进来，一脚踩出个坑，“账本缺的那一块，你真记得在这屋里？”“嗯。”林昭头也没回。“真的假的？”她拿手在鼻子底下扇灰，“我瞅着这地，三年没进过人。”“进了。”林昭用下巴指了指地面，“灰是后撒的，铁砧底下那一圈比旁边厚。”账本半年前烧的，缺了一角，兄妹俩翻过三回都", "tail": "所以先拓。墨吃进纸里，灯照不透。”林小满问：“老韩肯半夜开门？”沈鹤年答：“他欠我一副字版。你只问他，沈瘸子那副《雪江帖》还要不要。”林昭把钥匙拍在她掌心：“只开灶房，别点灯。曹家巡夜的在巷口，见亮就进来。”林小满捏钥匙走了两步，又回头：“拓完谁送？”沈鹤年把断指按在纸角：“我送。拓本分开藏：一份灶膛灰，一份鸡笼底。”"}, {"no": 17, "chars": 3372, "english": 0, "banned": 1, "title": "茧镜辞后", "level": "炼气初期", "act": "第一幕 · 铁匠之子", "volume": "第1卷 · 人界·痕镜", "head": "林昭把账本搁在旧屋的木案上。案脚垫了半块砖，一按还是晃。油灯推到跟前，灯芯剪得短，光只罩住巴掌大一块。烧过的纸边一碰就掉渣，他不敢用指甲，改用指腹去蹭。炼气初期的灵力收不住，稍一用力，焦纸就碎。这本账是从火场里抢出来的，烧掉大半。只剩中间十几页还能认字。他要的东西就在上头。缺的那一角，能对地契上的字号。对上了，铺子才算他的。对不上，沈鹤年垫的那笔灵石就白花。这屋子是铁匠铺的后院，铺面烧塌了，后院还剩三间。他昨天翻过一遍账本，缺角在第七页，当时没细看。今天带了灯来，是想把那一页拆开。“哥，你昨儿不是看过了？”林小满靠", "tail": "我手里没角，才叫坏事。”她这才明白：角是给开门的人验的，石缝是给偷的人栽的。她压低声音：“那你藏的时候，有没有人看见？”林昭没答，只把门闩轻轻扣上。林小满盯着崖口，手边摸到一块尖石，攥住了。她想了想，又问：“木楔换新，谁看得出？”林昭隔着门说：“看得出的人，本来就知道该看哪儿。”她记下这句，把尖石换到左手，右手空出来。"}, {"no": 18, "chars": 3435, "english": 0, "banned": 1, "title": "隙锤诰六", "level": "炼气初期", "act": "第一幕 · 铁匠之子", "volume": "第1卷 · 人界·痕镜", "head": "旧屋门轴响了一声，林昭跨过门槛，脚踩碎瓦。沈鹤年坐在桌边，右手压着桌角一个油纸包。林小满从林昭身后探出半个脑袋，鼻子里哼了一声。“师父。”林昭站定，没再往前走。抬起左眼——那只灰的——沈鹤年看了看门口的方向，嘴里不紧不慢地说了句急什么。绕过林昭，林小满伸手就要去够那个油纸包。“就是这个——”右手没动，沈鹤年反问了一句你说呢。林小满的手停在半空。林昭看了一眼那个油纸包。烧焦的边角露在外面，缺的那一角正好在沈鹤年右手底下。这账本从火堆里抢出来时就缺了一角，林昭一直以为那角是火烧没的。前日捡到的那片油纸，压痕边缘齐整，分", "tail": "。”林小满问：“少一针能换粮？”“只兑零。”沈鹤年说，“得赶在晾票前，包回缺角那面。”林小满把票塞进鞋帮：“包呢？”沈鹤年推给林昭：“活结朝里，缺角朝外。周老周验包先摸角，对不上就拖时辰。拖过晌午换班，票作废。”林昭没接：“你怕他拖？”“怕他不拖。”沈鹤年说，“他不拖，就是认出你了。”林小满系紧鞋带：“那就别让他摸。”"}]};

  return 'ok';
}

function render(d){
  DATA = d;
  const pct = d.target ? d.generated / d.target * 100 : 0;
  document.querySelector('#sub').textContent =
    `更新于 ${d.updated}　｜　目标每章 3600 字　｜　模型 auto/deepseek-v4.1-flash-max`;
  document.querySelector('#kGen').textContent = d.generated;
  document.querySelector('#kPct').textContent = pct.toFixed(1) + '%';
  document.querySelector('#kChars').textContent =
    (d.total_chars/10000).toFixed(1) + ' 万';
  document.querySelector('#kAvg').textContent = d.avg;

  const bad = d.chapters.filter(c => quality(c) !== 'ok').length;
  document.querySelector('#kBad').textContent = bad;
  document.querySelector('#kBad').style.color = bad ? 'var(--rose)' : 'var(--emerald)';

  document.querySelector('#fill').style.width = pct + '%';
  document.querySelector('#proglbl').textContent =
    `${d.generated} / ${d.target} 章　${(d.total_chars/10000).toFixed(1)} 万字`;

  // 幕进度
  const acts = {};
  d.chapters.forEach(c => {
    if (!acts[c.act]) acts[c.act] = {done:0, chars:0};
    acts[c.act].done++;
    acts[c.act].chars += c.chars;
  });
  const ACT_TOTAL = {'第一幕 · 铁匠之子':400,'第二幕 · 人界之巅':1200};
  document.querySelector('#actbars').innerHTML = Object.entries(acts).map(([nm,v])=>{
    const tot = ACT_TOTAL[nm] || 400;
    const p = Math.min(100, v.done/tot*100);
    return `<div class="actbar">
      <div class="nm">${nm}</div>
      <div class="tr"><div style="width:${p}%"></div></div>
      <div class="ct">${v.done}/${tot} 章　${(v.chars/10000).toFixed(1)} 万字</div>
    </div>`;
  }).join('');

  // 章节网格
  const byNo = {};
  d.chapters.forEach(c => byNo[c.no] = c);
  let grid = '';
  for (let i=1; i<=d.target; i++){
    const c = byNo[i];
    if (c){
      const q = quality(c);
      grid += `<div class="ch ${q==='ok'?'done':q}" title="第${i}章 ${c.chars}字">${i}</div>`;
    } else {
      grid += `<div class="ch todo" title="第${i}章 未写">${i}</div>`;
    }
  }
  document.querySelector('#chgrid').innerHTML = grid;

  // 预览：最后一章
  const last = d.chapters[d.chapters.length-1];
  if (last){
    document.querySelector('#ph1').textContent =
      `第${last.no}章《${last.title}》 ${last.chars} 字`;
    document.querySelector('#p1').textContent = last.head + '…';
    document.querySelector('#ph2').textContent = last.level;
    document.querySelector('#p2').textContent = '…' + last.tail;
  }

  // 表格（倒序，最新的在前）
  document.querySelector('#tbody').innerHTML =
    d.chapters.slice().reverse().map(c=>{
      const q = quality(c);
      const cls = q==='ok'?'ok':(q==='bad'?'bad':'warn');
      const txt = q==='ok'?'合格':(q==='bad'?'英文污染':'字数/套话');
      return `<tr>
        <td class="mono">${c.no}</td>
        <td>${c.title}</td>
        <td style="color:var(--violet)">${c.level}</td>
        <td>${c.chars}</td>
        <td style="color:${c.english?'var(--rose)':'var(--dim)'}">${c.english}</td>
        <td style="color:${c.banned>8?'var(--amber)':'var(--dim)'}">${c.banned}</td>
        <td><span class="pill ${cls}">${txt}</span></td>
        <td style="font-size:10px;color:var(--dim)">${c.act} / ${c.volume}</td>
      </tr>`;
    }).join('');
}

async function tick(){
  try{
    const r = await fetch('progress.json?_=' + Date.now());
    if (r.ok) render(await r.json());
  }catch(e){ /* 首次打开可能还没有数据 */ }
}
tick();
setInterval(tick, 15000);
</script>
</body>
</html>
